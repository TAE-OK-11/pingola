server:
  http_listen:
    - "0.0.0.0:80"
    - "[::]:80"
  https_listen:
    - "0.0.0.0:443"
    - "[::]:443"
  http3_listen:
    - "0.0.0.0:443"
    - "[::]:443"
  http3_internal_listen: "127.0.0.1:18080"
  http3_internal_handoff_enabled: false
  http3_max_idle_timeout_seconds: 300
  http3_max_requests_per_connection: 128
  http3_max_concurrent_streams: 64
  http3_enable_early_data: false
  http3_stateless_retry: true
  certificate: /etc/pingora/cert/live/tae00217.cloud/fullchain.pem
  private_key: /etc/pingora/cert/live/tae00217.cloud/privkey.pem
  threads: 1
  upstream_keepalive_pool_size: 256
  downstream_keepalive_requests: 500
  max_retries: 2
  graceful_shutdown_timeout_seconds: 5
  static_cache_bytes: 16777216
  access_log: false
  health_socket: /tmp/pingora/health.sock
  legacy_pingola_health: true
  health_details: false
  global_active_requests: 0
  static_active_requests_per_client: 16
  http2_max_concurrent_streams: 32
  downstream_max_connections: 2048
  downstream_request_header_timeout_seconds: 15

trusted_proxies:
  - "173.245.48.0/20"
  - "103.21.244.0/22"
  - "103.22.200.0/22"
  - "103.31.4.0/22"
  - "141.101.64.0/18"
  - "108.162.192.0/18"
  - "190.93.240.0/20"
  - "188.114.96.0/20"
  - "197.234.240.0/22"
  - "198.41.128.0/17"
  - "162.158.0.0/15"
  - "104.16.0.0/13"
  - "104.24.0.0/14"
  - "172.64.0.0/13"
  - "131.0.72.0/22"
  - "2400:cb00::/32"
  - "2606:4700::/32"
  - "2803:f800::/32"
  - "2405:b500::/32"
  - "2405:8100::/32"
  - "2a06:98c0::/29"
  - "2c0f:f248::/32"

upstreams:
  navidrome:
    address: "10.77.0.1:4533"
    protocol: http1
    idle_timeout_seconds: 300
    read_timeout_seconds: 3600
    write_timeout_seconds: 3600
  vaultwarden:
    address: "10.77.0.1:8081"
    protocol: http1
    idle_timeout_seconds: 15
  couchdb:
    address: "10.77.0.1:5984"
    protocol: http1
    read_timeout_seconds: 3600
    write_timeout_seconds: 3600
    idle_timeout_seconds: 15
  adguard_dns:
    address: "10.77.0.1:3333"
    protocol: http1
  adguard_dns_doh:
    address: "10.77.0.1:1852"
    tls: true
    protocol: auto
    http2_max_concurrent_streams: 256
    http2_stream_window_bytes: 2097152
    http2_connection_window_bytes: 16777216
    http2_ping_interval_seconds: 30
    sni: direct.tae00217.cloud
    verify_certificate: true
    connect_timeout_seconds: 2
    read_timeout_seconds: 30
    write_timeout_seconds: 30
    idle_timeout_seconds: 300
  adguard_korea:
    address: "127.0.0.1:3333"
    protocol: http1
  adguard_korea_doh:
    address: "127.0.0.1:1852"
    tls: true
    protocol: auto
    http2_max_concurrent_streams: 256
    http2_stream_window_bytes: 2097152
    http2_connection_window_bytes: 16777216
    http2_ping_interval_seconds: 30
    sni: direct.tae00217.cloud
    verify_certificate: true
    connect_timeout_seconds: 2
    read_timeout_seconds: 30
    write_timeout_seconds: 30
    idle_timeout_seconds: 300

hosts:
  navidrome_cdn:
    domains:
      - cdn.music.tae00217.cloud
    handler: navidrome-cdn
    upstream: navidrome
    redirect_http: true
  navidrome_main:
    domains:
      - music.tae00217.cloud
    handler: navidrome-main
    upstream: navidrome
    redirect_http: true
  vaultwarden:
    domains:
      - password.tae00217.cloud
    handler: vaultwarden
    upstream: vaultwarden
    redirect_http: true
    max_body_bytes: 536870912
  couchdb:
    domains:
      - sync.tae00217.cloud
    handler: couchdb
    upstream: couchdb
    redirect_http: true
    max_body_bytes: 536870912
  adguard_dns:
    domains:
      - dns.tae00217.cloud
    handler: adguard-dns
    upstream: adguard_dns
    redirect_http: true
    max_body_bytes: 65536
  adguard_korea:
    domains:
      - korea.tae00217.cloud
    handler: adguard-korea
    upstream: adguard_korea
    redirect_http: true
    max_body_bytes: 65536
