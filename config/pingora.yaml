server:
  http_listen:
    - "0.0.0.0:80"
    - "[::]:80"
  https_listen:
    - "0.0.0.0:443"
    - "[::]:443"
  http3_listen:
    - "0.0.0.0:443"
    - "[::]:443"
  http3_max_idle_timeout_seconds: 300
  http3_max_requests_per_connection: 128
  http3_max_concurrent_streams: 64
  http3_enable_early_data: false
  http3_stateless_retry: true
  certificate: /etc/pingora/cert/live/tae00217.cloud/fullchain.pem
  private_key: /etc/pingora/cert/live/tae00217.cloud/privkey.pem
  threads: 2
  upstream_keepalive_pool_size: 64
  downstream_keepalive_requests: 500
  max_retries: 2
  graceful_shutdown_timeout_seconds: 5
  static_cache_bytes: 8388608
  access_log: false
  health_socket: /tmp/pingora/health.sock
  legacy_pingola_health: true
  health_details: false
  global_active_requests: 192
  static_active_requests_per_client: 16
  http2_max_concurrent_streams: 32
  http2_stream_window_bytes: 1048576
  http2_connection_window_bytes: 4194304
  quic_initial_max_data: 4194304
  quic_stream_window: 1048576
  quic_max_connection_window: 4194304
  quic_max_stream_window: 2097152
  quic_send_capacity_factor: 2.0
  downstream_max_connections: 384
  downstream_request_header_timeout_seconds: 15

trusted_proxies:
  - "173.245.48.0/20"
  - "103.21.244.0/22"
  - "103.22.200.0/22"
  - "103.31.4.0/22"
  - "141.101.64.0/18"
  - "108.162.192.0/18"
  - "190.93.240.0/20"
  - "188.114.96.0/20"
  - "197.234.240.0/22"
  - "198.41.128.0/17"
  - "162.158.0.0/15"
  - "104.16.0.0/13"
  - "104.24.0.0/14"
  - "172.64.0.0/13"
  - "131.0.72.0/22"
  - "2400:cb00::/32"
  - "2606:4700::/32"
  - "2803:f800::/32"
  - "2405:b500::/32"
  - "2405:8100::/32"
  - "2a06:98c0::/29"
  - "2c0f:f248::/32"

upstreams:
  navidrome:
    address: "10.77.0.1:4533"
    tls: true
    sni: music.tae00217.cloud
    protocol: http3-preferred
    verify_certificate: true
    http3_bbr2: true
    http3_max_concurrent_streams: 64
    http3_pool_connections: 2
    http2_max_concurrent_streams: 64
    http2_stream_window_bytes: 1048576
    http2_connection_window_bytes: 4194304
    http3_warmup: true
    http3_warmup_path: /rest/ping
    connect_timeout_seconds: 5
    idle_timeout_seconds: 300
    read_timeout_seconds: 3600
    write_timeout_seconds: 3600
  # Plaintext H2C gRPC to Navidrome over WireGuard (ND_PUBLICGRPCADDRESS /
  # ND_PUBLICGRPCPORT, default 127.0.0.1:50051 -> deploy binds 10.77.0.1:50051).
  # WireGuard already encrypts the overlay, so prior-knowledge H2C avoids the
  # double TLS of H2/H3 upstreams. Serves the full public surface
  # (Ping/Login/CreateAdmin/Invoke/InvokeNative/Open/Subscribe) plus health
  # and reflection.
  navidrome_grpc:
    address: "10.77.0.1:50051"
    tls: false
    protocol: grpc
    http2_max_concurrent_streams: 128
    http2_stream_window_bytes: 2097152
    http2_connection_window_bytes: 8388608
    http2_ping_interval_seconds: 30
    warmup_on_start: true
    warmup_path: /rest/ping
    connect_timeout_seconds: 5
    idle_timeout_seconds: 300
    read_timeout_seconds: 3600
    write_timeout_seconds: 3600
  vaultwarden:
    address: "10.77.0.1:8081"
    protocol: http1
    idle_timeout_seconds: 15
  couchdb:
    address: "10.77.0.1:5984"
    protocol: http1
    read_timeout_seconds: 3600
    write_timeout_seconds: 3600
    idle_timeout_seconds: 15
  adguard_dns:
    address: "10.77.0.1:3333"
    protocol: http1
  adguard_dns_doh:
    address: "10.77.0.1:1852"
    tls: true
    protocol: auto
    http2_max_concurrent_streams: 256
    http2_stream_window_bytes: 2097152
    http2_connection_window_bytes: 8388608
    http2_ping_interval_seconds: 30
    warmup_on_start: true
    warmup_path: /
    sni: direct.tae00217.cloud
    verify_certificate: true
    connect_timeout_seconds: 2
    read_timeout_seconds: 30
    write_timeout_seconds: 30
    idle_timeout_seconds: 300
  adguard_korea:
    address: "127.0.0.1:3333"
    protocol: http1
  adguard_korea_doh:
    address: "127.0.0.1:1852"
    tls: true
    protocol: auto
    http2_max_concurrent_streams: 256
    http2_stream_window_bytes: 2097152
    http2_connection_window_bytes: 8388608
    http2_ping_interval_seconds: 30
    warmup_on_start: true
    warmup_path: /
    sni: direct.tae00217.cloud
    verify_certificate: true
    connect_timeout_seconds: 2
    read_timeout_seconds: 30
    write_timeout_seconds: 30
    idle_timeout_seconds: 300

route_limits:
  navidrome_stream:
    rate_per_second: 40
    burst: 15
    active_requests: 10
  navidrome_cover:
    rate_per_second: 20
    burst: 20
    active_requests: 24
  navidrome_api:
    rate_per_second: 20
    burst: 30
    active_requests: 24
  navidrome_grpc:
    rate_per_second: 20
    burst: 30
    active_requests: 24

hosts:
  navidrome_cdn:
    domains:
      - cdn.music.tae00217.cloud
    handler: navidrome-cdn
    upstream: navidrome
    redirect_http: true
  navidrome_main:
    domains:
      - music.tae00217.cloud
    handler: navidrome-main
    upstream: navidrome
    redirect_http: true
  vaultwarden:
    domains:
      - password.tae00217.cloud
    handler: vaultwarden
    upstream: vaultwarden
    redirect_http: true
    max_body_bytes: 536870912
  couchdb:
    domains:
      - sync.tae00217.cloud
    handler: couchdb
    upstream: couchdb
    redirect_http: true
    max_body_bytes: 536870912
  adguard_dns:
    domains:
      - dns.tae00217.cloud
    handler: adguard-dns
    upstream: adguard_dns
    redirect_http: true
    max_body_bytes: 65536
  adguard_korea:
    domains:
      - korea.tae00217.cloud
    handler: adguard-korea
    upstream: adguard_korea
    redirect_http: true
    max_body_bytes: 65536
