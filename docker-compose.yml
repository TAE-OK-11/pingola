services:
  pingora:
    container_name: pingora
    image: ${PINGORA_IMAGE:-pingora:local}
    build:
      context: .
      args:
        RUST_TARGET_CPU: cascadelake
    # Host networking is required for production UDP GSO/GRO and kTLS: the
    # container inherits the host kernel module set (CONFIG_TLS, UDP_SEGMENT).
    # On bridge networks, ensure the host kernel is >= 5.19 for TLS 1.3 kTLS RX.
    network_mode: host
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 8s
    pids_limit: 256
    read_only: true
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp/pingora:size=16m,mode=0700,uid=10001,gid=10001
    environment:
      PINGORA_CONFIG: /etc/pingora/pingora.yaml
    volumes:
      - ${PINGORA_CONFIG_FILE:-./config/pingora.yaml}:/etc/pingora/pingora.yaml:ro
      - ${PINGORA_CERT_ROOT:-/etc/letsencrypt}:/etc/pingora/cert:ro
