server:
  http_listen:
    - "127.0.0.1:28081"
  https_listen:
    - "127.0.0.1:28443"
    - "127.0.0.1:28453"
  http3_listen:
    - "127.0.0.1:28443"
  http3_internal_listen: "127.0.0.1:28080"
  http3_max_idle_timeout_seconds: 1
  http3_max_concurrent_streams: 32
  http3_enable_early_data: true
  # This fixture models a trusted private origin. Public listeners keep the
  # default Retry protection enabled; private origin 0-RTT explicitly opts out.
  http3_stateless_retry: false
  downstream_max_connections: 128
  certificate: /tmp/pingora-upstream-http3/cert.pem
  private_key: /tmp/pingora-upstream-http3/key.pem
  threads: 1
  upstream_keepalive_pool_size: 8
  downstream_keepalive_requests: 64
  max_retries: 1
  graceful_shutdown_timeout_seconds: 2
  static_cache_bytes: 4194304
  access_log: true
  health_socket: /tmp/pingora-upstream-http3/origin-health.sock

trusted_proxies:
  - "127.0.0.0/8"
  - "::1/128"

upstreams:
  backend:
    address: "127.0.0.1:19090"

hosts:
  origin:
    domains:
      - front.test
      - fallback.test
    handler: navidrome-main
    upstream: backend
    redirect_http: false
    max_body_bytes: 1048576

route_limits:
  navidrome_api:
    rate_per_second: 0
    active_requests: 0
