server:
  http_listen:
    - "127.0.0.1:80"
  https_listen:
    - "127.0.0.1:443"
  http3_listen:
    - "127.0.0.1:8443"
  http3_internal_listen: "127.0.0.1:18080"
  http3_max_idle_timeout_seconds: 15
  http3_max_concurrent_streams: 16
  certificate: /tmp/pingora-integration/cert.pem
  private_key: /tmp/pingora-integration/key.pem
  threads: 1
  upstream_keepalive_pool_size: 16
  downstream_keepalive_requests: 37
  max_retries: 1
  graceful_shutdown_timeout_seconds: 2
  static_cache_bytes: 4194304
  access_log: true
  health_socket: /tmp/pingora-integration/health.sock

trusted_proxies:
  - "127.0.0.0/8"
  - "10.0.0.0/8"

upstreams:
  backend:
    address: "127.0.0.1:19090"
  adguard_dns_doh:
    address: "127.0.0.1:19090"

hosts:
  static:
    domains:
      - static.test
    handler: static
    static_root: /tmp/pingora-integration/www
  app:
    domains:
      - app.test
    handler: navidrome-main
    upstream: backend
    redirect_http: true
    max_body_bytes: 16
  vault:
    domains:
      - vault.test
    handler: vaultwarden
    upstream: backend
    redirect_http: true
  couch:
    domains:
      - couch.test
    handler: couchdb
    upstream: backend
    redirect_http: true
  adguard:
    domains:
      - dns.test
    handler: adguard-dns
    upstream: backend
    redirect_http: true
