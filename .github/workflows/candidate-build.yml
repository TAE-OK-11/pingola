name: Candidate proxy builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bench/candidates/build.sh
      - .github/workflows/candidate-build.yml

permissions:
  contents: read

env:
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_NET_RETRY: "10"
  RUST_VERSION: "1.98.1"

jobs:
  build:
    name: ${{ matrix.candidate }} x86-64-v2 fat-LTO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        candidate: [pingap, aralez, pingpong, zentinel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake libssl-dev lld ninja-build \
            perl pkg-config protobuf-compiler time
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: candidate-${{ matrix.candidate }}-${{ runner.os }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('bench/candidates/build.sh') }}
          restore-keys: candidate-${{ matrix.candidate }}-${{ runner.os }}-rust-${{ env.RUST_VERSION }}-
      - name: Build pinned candidate
        run: bash bench/candidates/build.sh "${{ matrix.candidate }}" "$RUNNER_TEMP/artifact"
      - name: Upload candidate binary and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.candidate }}-x86-64-v2-fat
          path: ${{ runner.temp }}/artifact/
          if-no-files-found: error
          retention-days: 14
