name: apply-pq-retry

on:
  pull_request:
    branches: [agent/quiche-http3]

permissions:
  contents: write

concurrency:
  group: pq-retry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate-and-verify:
    if: github.event.pull_request.head.ref == 'agent/unify-boringssl' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/unify-boringssl
          fetch-depth: 0

      - name: Install build and integration tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake jq libclang-dev nghttp2-client ninja-build openssl perl pkg-config
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Apply hybrid PQ and QUIC hardening
        run: |
          python3 scripts/implement_pq_retry.py
          cargo fmt --all
          git diff --check

      - name: Verify Rust and protocol behavior
        run: |
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo check --all-targets --locked --no-default-features --features system-allocator,tls-boringssl
          cargo check --all-targets --locked --no-default-features --features jemalloc,tls-boringssl
          tests/http3.sh

      - name: Commit verified migration
        run: |
          set -euxo pipefail
          git checkout HEAD -- .github/workflows/apply-pq-retry.yml
          git rm scripts/implement_pq_retry.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(security): add hybrid PQ TLS and QUIC admission hardening'
          git push origin HEAD:agent/unify-boringssl
