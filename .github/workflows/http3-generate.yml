name: http3-harden

on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/quiche-http3
          fetch-depth: 0
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build perl
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Apply HTTP/3 hardening
        run: |
          python3 tools/http3_harden.py
          cargo fmt --all
      - name: Compile and test
        run: |
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Commit validated HTTP/3 hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/http3.rs
          git diff --cached --check
          git commit -m 'refactor(http3): bound connections and preserve public port'
          git push origin HEAD:agent/quiche-http3
