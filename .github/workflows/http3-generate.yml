name: http3-generate

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build perl
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Generate HTTP/3 integration
        run: |
          python3 tools/http3_generate.py
          cargo update --verbose
          cargo fmt --all
      - name: Compile and test
        run: |
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Package generated files
        run: |
          mkdir -p http3-output/files
          git diff --name-status > http3-output/name-status.txt
          git diff --binary > http3-output/http3.patch
          git diff --name-only -z | while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              mkdir -p "http3-output/files/$(dirname "$file")"
              cp "$file" "http3-output/files/$file"
            fi
          done
      - name: Upload generated integration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: http3-integration-output
          path: http3-output/
          if-no-files-found: error
          retention-days: 3
