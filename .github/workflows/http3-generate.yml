name: http3-end-to-end

on:
  pull_request:

permissions:
  contents: write

jobs:
  http3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/quiche-http3
          fetch-depth: 0
      - name: Install native and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake jq ninja-build openssl perl
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Apply tokio-quiche server event fix
        run: |
          python3 tools/http3_event_fix.py
          cargo fmt --all
      - name: Compile HTTP/3 targets
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Exercise real QUIC and HTTP/3 requests
        run: |
          chmod 755 tests/http3.sh
          tests/http3.sh
      - name: Commit validated event handling
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/http3.rs
          git diff --cached --check
          git commit -m 'fix(http3): handle tokio-quiche server request events'
          git push origin HEAD:agent/quiche-http3
