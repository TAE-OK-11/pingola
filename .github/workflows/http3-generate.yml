name: http3-finalize

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/quiche-http3
          fetch-depth: 0
      - name: Install native and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake jq libcap2-bin nghttp2-client ninja-build openssl perl
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Apply final HTTP/3 integration
        run: |
          python3 tools/http3_event_fix.py
          python3 tools/http3_token_harden.py
          python3 tools/http3_ci_finalize.py
          cargo update --verbose
          cargo fmt --all
          chmod 755 tests/http3.sh
      - name: Verify TLS provider boundaries
        run: |
          cargo tree --locked > /tmp/cargo-tree.txt
          cargo tree --locked -p pingora-rustls@0.8.1 > /tmp/pingora-tls-tree.txt
          cargo tree --locked -p tokio-quiche@0.19.1 > /tmp/http3-tls-tree.txt
          grep -q 'aws-lc-rs v1.17.3' /tmp/pingora-tls-tree.txt
          grep -q 'rustls v0.23.43' /tmp/pingora-tls-tree.txt
          ! grep -Eiq '(^|[[:space:]])(boring|boring-sys|pingora-boringssl) v' /tmp/pingora-tls-tree.txt
          grep -q 'quiche v0.29.3' /tmp/http3-tls-tree.txt
          grep -q 'boring v4.22.0' /tmp/http3-tls-tree.txt
          grep -q 'boring-sys v4.22.0' /tmp/http3-tls-tree.txt
          ! grep -q 'pingora-boringssl v' /tmp/cargo-tree.txt
      - name: Compile, lint and unit test
        run: |
          cargo fmt --all --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo check --all-targets --locked --no-default-features --features system-allocator,tls-aws-lc
          cargo check --all-targets --locked --no-default-features --features jemalloc,tls-aws-lc
          bash -n tests/http3.sh
          bash -n tests/docker_runtime.sh
      - name: Exercise real QUIC and HTTP/3 requests
        run: tests/http3.sh
      - name: Commit validated HTTP/3 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock Dockerfile src examples tests config/pingora.yaml .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'feat(http3): finalize quiche frontend and deployment integration'
          git push origin HEAD:agent/quiche-http3
