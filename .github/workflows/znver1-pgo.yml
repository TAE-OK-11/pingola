name: znver1-full-stack-pgo

concurrency:
  group: pingora-znver1-pgo-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-train-publish:
    # Keep latest-znver1 aligned with main without depending on an optional
    # self-hosted runner. The profile is still generated independently with
    # target-cpu=znver1 and is never shared with the x86-64-v2 build.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify znver1-compatible training host
        run: |
          set -euxo pipefail
          test "$(uname -m)" = x86_64
          command -v docker
          command -v jq
          command -v openssl
          lscpu
          flags=$(grep -m1 '^flags' /proc/cpuinfo)
          for flag in aes avx avx2 bmi1 bmi2 fma pclmulqdq sse4_1 sse4_2 ssse3; do
            grep -qw "${flag}" <<<"${flags}"
          done

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/tae-ok-11/pingora
            ghcr.io/tae-ok-11/pingola
          tags: |
            type=raw,value=latest-znver1,enable={{is_default_branch}}
            type=sha,prefix=sha-,suffix=-znver1
            type=semver,pattern={{version}},suffix=-znver1
          labels: |
            org.opencontainers.image.title=JBS Pingora znver1
            org.opencontainers.image.description=znver1-targeted full-stack PGO image
            org.opencontainers.image.source=https://github.com/TAE-OK-11/pingola
            org.opencontainers.image.allocator=tcmalloc
            org.opencontainers.image.tls.provider=boringssl
            org.opencontainers.image.http3.provider=quiche
            org.opencontainers.image.http3.internal-protocol=h2c
            org.opencontainers.image.pgo.profile-family=znver1

      - name: Train, build and publish znver1 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          # PRs need a local image for runtime tests. Production builds publish
          # registry output only so provenance/SBOM attestations are not mixed
          # with the Docker exporter.
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALLOCATOR=tcmalloc
            TLS_PROVIDER=boringssl
            PGO_MODE=train
            PGO_NATIVE_BORING=on
            PGO_TRAIN_TARGET_CPU=znver1
            PGO_WEIGHT_H1=60
            PGO_WEIGHT_H2=180
            PGO_WEIGHT_H3=900
            PGO_WEIGHT_UPSTREAM_H3_BBR2=700
            PGO_WEIGHT_UPSTREAM_H3_CUBIC=250
            PGO_WEIGHT_TLS=300
            PGO_WEIGHT_TAIL=80
            RUST_TARGET_CPU=znver1
            RUST_LTO=fat
            BUILD_VERSION=${{ steps.meta.outputs.version }}-znver1
            BUILD_REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=image-znver1-full-pgo
            type=gha,scope=image-test-znver1-off
            type=gha,scope=image-x86-64-v2-full-pgo
          cache-to: type=gha,mode=max,scope=image-znver1-full-pgo
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Verify znver1 profile and runtime
        run: |
          set -euxo pipefail
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            IMAGE_REF=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          else
            test -n '${{ steps.build.outputs.digest }}'
            IMAGE_REF="ghcr.io/tae-ok-11/pingora@${{ steps.build.outputs.digest }}"
            docker pull "${IMAGE_REF}"
          fi
          test -n "${IMAGE_REF}"
          test "$(docker image inspect "${IMAGE_REF}" | jq -r '.[0].Config.Labels["org.opencontainers.image.rust.target-cpu"]')" = znver1
          test "$(docker image inspect "${IMAGE_REF}" | jq -r '.[0].Config.Labels["org.opencontainers.image.rust.pgo-train-target-cpu"]')" = znver1
          test "$(docker image inspect "${IMAGE_REF}" | jq -r '.[0].Config.Labels["org.opencontainers.image.native.pgo"]')" = on
          test "$(docker image inspect "${IMAGE_REF}" | jq -r '.[0].Config.Labels["org.opencontainers.image.pgo.profile-family"]')" = znver1
          docker run --rm --entrypoint sh "${IMAGE_REF}" -c \
            'test -s /usr/share/doc/pingora/pgo-profile-summary.txt && test -s /usr/share/doc/pingora/pgo-native-profile-summary.txt'
          PINGORA_TEST_IMAGE="${IMAGE_REF}" \
          PINGORA_EXPECTED_TARGET_CPU=znver1 \
          PINGORA_EXPECTED_LTO=fat \
          PINGORA_EXPECTED_TLS_PROVIDER=boringssl \
          PINGORA_EXPECTED_PGO=train \
            tests/docker_runtime.sh
