name: apply-full-stack-refresh

on:
  push:
    branches:
      - agent/full-stack-refresh
    paths:
      - .github/workflows/apply-full-refresh.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/full-stack-refresh
          fetch-depth: 0
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libcap2-bin ninja-build jq nghttp2-client
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Refresh manifests and container bases
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo = '''[package]
          name = "jbs-pingora"
          version = "0.1.0"
          edition = "2021"
          rust-version = "1.97.1"
          license = "Apache-2.0"
          description = "A production-oriented Pingora reverse proxy replacing the JBS Nginx gateway"
          repository = "https://github.com/TAE-OK-11/pingora"

          [[bin]]
          name = "pingora"
          path = "src/main.rs"

          [features]
          default = ["tcmalloc", "tls-aws-lc"]
          jemalloc = ["dep:tikv-jemalloc-ctl", "dep:tikv-jemallocator"]
          tcmalloc = ["dep:tcmalloc-better"]
          system-allocator = []
          tls-aws-lc = ["cloudflare-pingora/rustls"]

          [dependencies]
          anyhow = "1.0.104"
          ahash = "0.8.12"
          arrayvec = "0.7.8"
          async-trait = "0.1.91"
          brotli = "8.0.4"
          bytes = "1.12.1"
          clap = { version = "4.6.5", features = ["derive", "env"] }
          dashmap = "6.2.1"
          env_logger = "0.11.11"
          flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
          http = "1.5.0"
          httpdate = "1.0.3"
          ipnet = { version = "2.12.1", features = ["serde"] }
          log = { version = "0.4.33", features = ["release_max_level_info"] }
          lru = "0.18.2"
          mime_guess = "2.0.5"
          parking_lot = "0.12.5"
          percent-encoding = "2.3.2"
          cloudflare-pingora = { package = "pingora", version = "=0.8.1", default-features = false, features = ["proxy"] }
          rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
          rustls-pemfile = "2.2.0"
          rustix = { version = "1.1.4", features = ["process"] }
          serde = { version = "1.0.229", features = ["derive"] }
          serde_json = "1.0.151"
          serde-saphyr = "0.0.29"
          socket2 = "0.6.5"
          tcmalloc-better = { version = "=0.1.19", optional = true }
          tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats", "use_std"], optional = true }
          tikv-jemallocator = { version = "0.7.0", features = ["stats"], optional = true }
          tokio = { version = "1.53.1", features = ["fs", "net", "rt-multi-thread", "sync", "time"] }
          zstd = "0.13.3"

          [dev-dependencies]
          h2 = "0.4.15"
          tempfile = "3.27.0"

          # Pingora 0.8.1's rustls adapter hardcodes Ring. Keep the upstream API while
          # selecting AWS-LC for both Pingora and this binary, avoiding two crypto stacks.
          [patch.crates-io]
          pingora-core = { path = "vendor/pingora-core-0.8.1" }
          pingora-http = { path = "vendor/pingora-http-0.8.1" }
          pingora-proxy = { path = "vendor/pingora-proxy-0.8.1" }
          pingora-rustls = { path = "vendor/pingora-rustls-aws-lc" }

          [profile.release]
          codegen-units = 1
          lto = "fat"
          opt-level = 3
          panic = "abort"
          strip = "symbols"
          '''
          Path('Cargo.toml').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in cargo.splitlines()) + '\n')

          vendor = Path('vendor/pingora-rustls-aws-lc/Cargo.toml')
          text = vendor.read_text()
          old = 'rustls = { version = "=0.23.42",'
          new = 'rustls = { version = "=0.23.43",'
          if old not in text:
              raise SystemExit('expected vendored rustls version not found')
          vendor.write_text(text.replace(old, new))

          dockerfile = Path('Dockerfile')
          text = dockerfile.read_text()
          replacements = {
              'ARG DEBIAN_SUITE=trixie': 'ARG DEBIAN_SUITE=13',
              'FROM rust:1.97.1-slim-trixie@sha256:5c6f46a6e4472ab1ca7ba7d494e6677f2f219ebc02f32025d3986f057635ec9c AS builder':
                  'FROM rust:1.97.1-slim-trixie@sha256:69153971349358535be9821190190f026a761f690c6b58c68a914d14ab2d610a AS builder',
              'FROM debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd AS runtime':
                  'FROM debian:13-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd AS runtime',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected Dockerfile text not found: {old}')
              text = text.replace(old, new)
          dockerfile.write_text(text)

          for name in ['Dockerfile', '.github/workflows/ci.yml', '.github/workflows/bench-tools-build.yml']:
              path = Path(name)
              text = path.read_text()
              text = text.replace('--edition=2021', '--edition=2024')
              path.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          old = 'docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4'
          new = 'docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1'
          if text.count(old) != 2:
              raise SystemExit('expected two pinned login-action references')
          ci.write_text(text.replace(old, new))
          PY

          cargo update --verbose
          cargo fix --edition --all-targets --allow-dirty
          sed -i 's/edition = "2021"/edition = "2024"/' Cargo.toml
      - name: Validate Rust 2024, allocators, TLS and compression
        run: |
          set -euxo pipefail
          cargo fmt --check
          cargo tree --locked > /tmp/tree.txt
          grep -q 'aws-lc-rs v1.17.3' /tmp/tree.txt
          grep -q 'rustls v0.23.43' /tmp/tree.txt
          ! grep -Eiq '(^|[[:space:]])(ring|boring|boring-sys|pingora-boringssl) v' /tmp/tree.txt
          cargo tree --locked -i tcmalloc-better | grep -q 'tcmalloc-better v0.1.19'
          cargo tree --locked -i brotli | grep -q 'brotli v8.0.4'
          cargo tree --locked -i flate2 | grep -q 'flate2 v1.1.9'
          cargo tree --locked -i zstd | grep -q 'zstd v0.13.3'
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo check --all-targets --locked --no-default-features --features system-allocator,tls-aws-lc
          cargo check --all-targets --locked --no-default-features --features jemalloc,tls-aws-lc
          cargo build --locked --release
          target/release/pingora --allocator-info | grep -q 'allocator=tcmalloc implementation=google-tcmalloc'
          rustc --edition=2024 -D warnings bench/backend.rs -o /tmp/pgo-backend
          rustc --edition=2024 -D warnings bench/pgo_client.rs -o /tmp/pgo-client
      - name: Commit verified refresh
        run: |
          set -euxo pipefail
          rm -f .github/workflows/apply-full-refresh.yml .github/workflows/dependency-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'build: refresh Rust, dependencies and Debian 13 runtime'
          git push origin HEAD:agent/full-stack-refresh
