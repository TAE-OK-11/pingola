name: apply-unified-boringssl

on:
  pull_request:
    branches: [agent/quiche-http3]

permissions:
  contents: write

concurrency:
  group: unified-boringssl-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/unify-boringssl' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/unify-boringssl
          fetch-depth: 0

      - name: Install build and integration tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake jq libcap2-bin libclang-dev nghttp2-client ninja-build openssl perl pkg-config
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup show active-toolchain

      - name: Apply Cloudflare BoringSSL migration
        run: |
          python3 scripts/migrate-unified-boringssl.py
          rm -rf vendor/pingora-rustls-aws-lc
          if grep -RIn --exclude=Cargo.lock --exclude-dir=.git --exclude-dir=vendor \
            -E 'AWS-LC|aws-lc|tls-aws-lc|rustls::|rustls_pemfile|pingora-rustls' .; then
            echo 'legacy TLS provider references remain' >&2
            exit 1
          fi

      - name: Format and regenerate lockfile
        run: |
          cargo fmt --all
          cargo check --all-targets --no-default-features --features tcmalloc,tls-boringssl

      - name: Verify one shared BoringSSL graph
        run: |
          cargo tree --locked > /tmp/cargo-tree.txt
          cargo tree --locked -p pingora-boringssl@0.8.1 > /tmp/pingora-tls-tree.txt
          cargo tree --locked -p tokio-quiche@0.19.1 > /tmp/http3-tls-tree.txt
          cargo tree --locked -i boring@4.22.0 > /tmp/boring-reverse-tree.txt
          grep -q 'pingora-boringssl v0.8.1' /tmp/cargo-tree.txt
          grep -q 'quiche v0.29.3' /tmp/http3-tls-tree.txt
          grep -q 'boring v4.22.0' /tmp/pingora-tls-tree.txt
          grep -q 'boring-sys v4.22.0' /tmp/pingora-tls-tree.txt
          grep -q 'boring v4.22.0' /tmp/http3-tls-tree.txt
          grep -q 'boring-sys v4.22.0' /tmp/http3-tls-tree.txt
          grep -q 'pingora-boringssl v0.8.1' /tmp/boring-reverse-tree.txt
          grep -Eq '(quiche v0.29.3|tokio-quiche v0.19.1)' /tmp/boring-reverse-tree.txt
          ! grep -Eiq '(^|[[:space:]])(aws-lc-rs|aws-lc-sys|rustls) v' /tmp/cargo-tree.txt
          ! cargo tree --locked -d | grep -E '^(boring|boring-sys) v'

      - name: Test all supported allocator builds
        run: |
          cargo test --all-targets --locked --no-default-features --features tcmalloc,tls-boringssl
          cargo clippy --all-targets --locked --no-default-features --features tcmalloc,tls-boringssl -- -D warnings
          cargo check --all-targets --locked --no-default-features --features system-allocator,tls-boringssl
          cargo check --all-targets --locked --no-default-features --features jemalloc,tls-boringssl

      - name: Run TLS and HTTP/3 integration checks
        run: |
          cargo build --locked --no-default-features --features tcmalloc,tls-boringssl
          sudo setcap cap_net_bind_service=+ep target/debug/pingora
          sudo tests/runtime_preflight.sh
          tests/http3.sh

      - name: Commit verified migration
        run: |
          set -euxo pipefail
          git rm .github/workflows/apply-unified-boringssl.yml scripts/migrate-unified-boringssl.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor(tls): unify on Cloudflare BoringSSL'
          git push origin HEAD:agent/unify-boringssl
