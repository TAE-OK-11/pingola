name: apply-unified-boringssl

on:
  pull_request:
    branches: [agent/quiche-http3]

permissions:
  contents: write

concurrency:
  group: unified-boringssl-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-ci:
    if: github.event.pull_request.head.ref == 'agent/unify-boringssl' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/unify-boringssl
          fetch-depth: 0

      - name: Create verified CI workflow blob
        run: |
          python3 scripts/materialize_boringssl_ci.py
          grep -q 'Verify unified Cloudflare BoringSSL provider' ci-boringssl.yml
          grep -q 'TLS_PROVIDER=boringssl' ci-boringssl.yml
          ! grep -Eq 'AWS-LC|aws-lc|tls-aws-lc|pingora-rustls' ci-boringssl.yml

      - name: Commit materialized workflow
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-boringssl.yml
          git commit -m 'ci: materialize unified BoringSSL workflow'
          git push origin HEAD:agent/unify-boringssl
