name: apply-unified-boringssl

on:
  pull_request:
    branches: [agent/quiche-http3]

permissions:
  contents: write

concurrency:
  group: unified-boringssl-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  persist:
    if: github.event.pull_request.head.ref == 'agent/unify-boringssl' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/unify-boringssl
          fetch-depth: 0

      - name: Apply previously verified migration
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          python3 scripts/migrate-unified-boringssl.py
          rm -rf vendor/pingora-rustls-aws-lc
          sed -i \
            -e 's/AWS-LC/Cloudflare BoringSSL/g' \
            -e 's/aws-lc/boringssl/g' \
            bench/pgo_train.sh bench/pgo_compare_three.sh
          cargo fmt --all
          cargo generate-lockfile
          if grep -RIn \
            -E 'AWS-LC|aws-lc|tls-aws-lc|rustls::|rustls_pemfile|pingora-rustls' \
            Cargo.toml Dockerfile README.md src tests bench/*.sh; then
            echo 'legacy TLS provider references remain in active sources' >&2
            exit 1
          fi

      - name: Commit non-workflow migration files
        run: |
          set -euxo pipefail
          # GITHUB_TOKEN cannot modify workflow files. Preserve both workflows;
          # the connected GitHub client applies the verified CI workflow next.
          git checkout HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/apply-unified-boringssl.yml
          git rm scripts/migrate-unified-boringssl.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor(tls): unify on Cloudflare BoringSSL'
          git push origin HEAD:agent/unify-boringssl
