name: apply-hotpath-optimizations-once

on:
  push:
    branches: ["perf/hotpath-ahash-h3-fastpath"]
    paths:
      - .github/workflows/apply-hotpath-optimizations-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/hotpath-ahash-h3-fastpath
          fetch-depth: 0
      - name: Apply optimizations
        run: python3 tools/apply_hotpath_optimizations.py
      - name: Format
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cargo fmt --all
      - name: Commit optimized hot path
        run: |
          git rm tools/apply_hotpath_optimizations.py .github/workflows/apply-hotpath-optimizations-once.yml
          git add src/limits.rs src/h3_wire.rs src/static_files.rs src/upstream_h3.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: reduce hot-path hashing and H3 shard overhead"
          git push origin HEAD:perf/hotpath-ahash-h3-fastpath
