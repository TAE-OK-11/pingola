name: apply-http3-performance-fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/quiche-http3
          fetch-depth: 0

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake jq nghttp2-client ninja-build openssl perl
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Enable QUIC pacing and adaptive h2c flow control
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/http3.rs')
          text = path.read_text()

          old = '''    quic.discover_path_mtu = true;
              quic.send_capacity_factor = HTTP3_SEND_CAPACITY_FACTOR;
          '''
          new = '''    quic.discover_path_mtu = true;
              // QuicSettings defaults this wrapper-level switch to false and
              // then applies it over quiche's native default. Keep packet
              // pacing enabled so CUBIC sends are smoothed instead of bursty.
              quic.enable_pacing = true;
              quic.send_capacity_factor = HTTP3_SEND_CAPACITY_FACTOR;
          '''
          if text.count(old) != 1:
              raise SystemExit('QUIC pacing insertion point did not match')
          text = text.replace(old, new, 1)

          old = '''    let client: ProxyClient = Client::builder(TokioExecutor::new())
              .http2_only(true)
              .pool_max_idle_per_host(1)
              .build(connector);
          '''
          new = '''    let client: ProxyClient = Client::builder(TokioExecutor::new())
              .http2_only(true)
              // Large and concurrent audio responses should grow the loopback
              // H2 flow-control windows instead of repeatedly stalling on the
              // conservative static defaults.
              .http2_adaptive_window(true)
              .pool_max_idle_per_host(1)
              .build(connector);
          '''
          if text.count(old) != 1:
              raise SystemExit('h2c client builder insertion point did not match')
          text = text.replace(old, new, 1)

          old = '''pmtud=true max_udp_payload={} send_capacity_factor={}'''
          new = '''pmtud=true pacing=true max_udp_payload={} send_capacity_factor={}'''
          if text.count(old) != 1:
              raise SystemExit('HTTP/3 startup log insertion point did not match')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          cargo fmt --all

      - name: Verify performance changes
        run: |
          set -euxo pipefail
          cargo fmt --all --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo build --locked
          tests/http3.sh
          grep -q 'quic.enable_pacing = true' src/http3.rs
          grep -q 'http2_adaptive_window(true)' src/http3.rs

      - name: Commit verified changes
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/http3.rs
          git diff --cached --check
          git commit -m 'perf(http3): enable pacing and adaptive h2c flow control'
          git push origin HEAD:agent/quiche-http3
