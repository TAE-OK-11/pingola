name: apply-http3-performance-fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/quiche-http3
          fetch-depth: 0

      - name: Enable QUIC pacing and adaptive h2c flow control
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/http3.rs')
          text = path.read_text()

          if 'quic.enable_pacing = true;' not in text:
              anchor = "    quic.discover_path_mtu = true;\n"
              insertion = (
                  anchor
                  + "    // Keep QUIC packet sends paced instead of bursty.\n"
                  + "    quic.enable_pacing = true;\n"
              )
              if text.count(anchor) != 1:
                  raise SystemExit('QUIC pacing insertion point did not match')
              text = text.replace(anchor, insertion, 1)

          if '.http2_adaptive_window(true)' not in text:
              anchor = "        .http2_only(true)\n"
              insertion = (
                  anchor
                  + "        // Grow loopback H2 flow-control windows for large and\n"
                  + "        // concurrent audio responses instead of stalling on\n"
                  + "        // conservative static defaults.\n"
                  + "        .http2_adaptive_window(true)\n"
              )
              if text.count(anchor) != 1:
                  raise SystemExit('h2c client builder insertion point did not match')
              text = text.replace(anchor, insertion, 1)

          old_log = "pmtud=true max_udp_payload={} send_capacity_factor={}"
          new_log = "pmtud=true pacing=true max_udp_payload={} send_capacity_factor={}"
          if new_log not in text:
              if text.count(old_log) != 1:
                  raise SystemExit('HTTP/3 startup log insertion point did not match')
              text = text.replace(old_log, new_log, 1)

          path.write_text(text)
          PY

      - name: Commit performance changes
        run: |
          set -euxo pipefail
          git diff --check
          grep -q 'quic.enable_pacing = true' src/http3.rs
          grep -q 'http2_adaptive_window(true)' src/http3.rs
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/http3.rs
          git commit -m 'perf(http3): enable pacing and adaptive h2c flow control'
          git push origin HEAD:agent/quiche-http3
