name: dependency-audit-once

on:
  push:
    branches:
      - cursor/pingora-0.9-boring-5-f186

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cursor/pingora-0.9-boring-5-f186
      - name: Show dependencies held behind latest
        run: cargo update --verbose
      - name: Confirm critical TLS versions
        run: |
          cargo tree --locked -p pingora-boringssl@0.9.0 | grep -E 'boring(-sys)? v5\.2\.0'
          cargo tree --locked -p tokio-quiche@0.19.1 | grep -E 'boring(-sys)? v5\.2\.0'
          ! cargo tree --locked -d | grep -E '^(boring|boring-sys) v'
