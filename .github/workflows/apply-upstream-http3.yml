name: apply-upstream-http3

on:
  pull_request:
    branches: [agent/quiche-http3]

permissions:
  contents: write

concurrency:
  group: upstream-http3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate-and-verify:
    if: github.event.pull_request.head.ref == 'agent/upstream-http3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/upstream-http3
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake jq libcap2-bin libclang-dev nghttp2-client ninja-build openssl perl pkg-config
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Apply upstream HTTP3 integration
        run: |
          python3 scripts/apply_upstream_h3.py
          python3 scripts/fix_upstream_h3_compile.py
          python3 scripts/fix_upstream_h3_scope.py
          cargo generate-lockfile
          cargo fmt --all
          git diff --check
          grep -F 'Http3Preferred' src/config.rs >/dev/null
          grep -F 'mod upstream_h3;' src/main.rs >/dev/null
          grep -F 'http3_enable_early_data' src/http3.rs >/dev/null
          grep -F 'tokio-quiche' Cargo.lock >/dev/null
          grep -F 'quiche' Cargo.lock >/dev/null

      - name: Verify Rust implementation
        run: |
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo check --all-targets --locked --no-default-features --features system-allocator,tls-boringssl
          cargo check --all-targets --locked --no-default-features --features jemalloc,tls-boringssl

      - name: Commit verified integration
        run: |
          set -euxo pipefail
          git checkout HEAD -- .github/workflows/apply-upstream-http3.yml
          git rm scripts/apply_upstream_h3.py scripts/fix_upstream_h3_compile.py scripts/fix_upstream_h3_scope.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(http3): add upstream QUIC and replay-safe 0-RTT'
          git push origin HEAD:agent/upstream-http3
