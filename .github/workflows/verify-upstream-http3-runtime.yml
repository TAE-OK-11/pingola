name: verify-upstream-http3-runtime

on:
  pull_request:
    branches: [agent/quiche-http3]

permissions:
  contents: write

concurrency:
  group: upstream-http3-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-runtime:
    if: github.event.pull_request.head.ref == 'agent/upstream-http3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/upstream-http3
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake jq libcap2-bin libclang-dev nghttp2-client ninja-build openssl perl pkg-config
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Apply final upstream HTTP3 runtime changes
        run: |
          python3 scripts/apply_upstream_h3_zero_rtt.py
          python3 scripts/apply_private_h3_0rtt_retry.py
          cargo fmt --all
          git diff --check
          bash -n tests/upstream_http3.sh
          grep -F 'can_resume_early' src/upstream_h3.rs >/dev/null
          grep -F 'session ticket cached' src/upstream_h3.rs >/dev/null
          grep -F 'early-data request sent stream=' src/upstream_h3.rs >/dev/null
          grep -F 'pub http3_stateless_retry: bool' src/config.rs >/dev/null
          grep -F 'quic.disable_client_ip_validation = !stateless_retry;' src/http3.rs >/dev/null
          grep -F 'http3_stateless_retry: false' tests/fixtures/upstream_http3_origin.yaml >/dev/null
          grep -F 'tests/upstream_http3.sh' .github/workflows/ci.yml >/dev/null

      - name: Verify Rust and real upstream HTTP3
        run: |
          set -euxo pipefail
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo build --locked
          sudo setcap cap_net_bind_service=+ep target/debug/pingora
          if ! bash -x tests/upstream_http3.sh; then
            echo '===== origin.log =====' >&2
            cat /tmp/pingora-upstream-http3/origin.log >&2 2>/dev/null || true
            echo '===== front.log =====' >&2
            cat /tmp/pingora-upstream-http3/front.log >&2 2>/dev/null || true
            echo '===== fallback.log =====' >&2
            cat /tmp/pingora-upstream-http3/fallback.log >&2 2>/dev/null || true
            echo '===== backend.log =====' >&2
            cat /tmp/pingora-upstream-http3/backend.log >&2 2>/dev/null || true
            exit 1
          fi
          bash tests/http3.sh

      - name: Commit verified product changes
        run: |
          set -euxo pipefail
          # GITHUB_TOKEN cannot modify workflow files without workflows scope.
          # Restore them here; workflow consolidation is performed separately.
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/verify-upstream-http3-runtime.yml
          git rm scripts/apply_upstream_h3_zero_rtt.py
          git rm scripts/apply_private_h3_0rtt_retry.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'perf(http3): finalize private-origin 0-RTT upstream transport'
          git push origin HEAD:agent/upstream-http3
