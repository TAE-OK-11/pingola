name: format-cache-branch

on:
  push:
    branches:
      - fix/cache-content-encoding-bounds

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cache-content-encoding-bounds
          fetch-depth: 0
      - name: Install pinned rustfmt
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Apply rustfmt
        run: cargo +1.98.1 fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cache/integration.rs src/cache/navidrome.rs
          git commit -m "style: apply rustfmt"
          git push origin HEAD:fix/cache-content-encoding-bounds
