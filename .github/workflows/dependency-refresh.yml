name: finalize-rust-2024-and-workflows

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/full-stack-refresh
          fetch-depth: 0
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Make Rust 2024 drop order explicit and stage workflow content
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/limits.rs'): [(
                  '        let counter = loop {\n            match self.counters.entry(key.clone()) {',
                  '        let counter = loop {\n            let entry = self.counters.entry(key.clone());\n            match entry {'
              )],
              Path('src/preflight.rs'): [(
                  '    {\n        match bind_listener(address) {\n            Ok(socket) => {',
                  '    {\n        let bind_result = bind_listener(address);\n        match bind_result {\n            Ok(socket) => {'
              )],
              Path('tests/upstream_http2.rs'): [(
                  '                while let Some(result) = connection.accept().await {',
                  '                loop {\n                    let next = connection.accept().await;\n                    let Some(result) = next else {\n                        break;\n                    };'
              )],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'expected exactly one Rust 2024 migration site in {path}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)

          generated = Path('generated-workflows')
          generated.mkdir(exist_ok=True)

          ci = Path('.github/workflows/ci.yml').read_text()
          old_login = 'docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4'
          new_login = 'docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1'
          if ci.count(old_login) != 2:
              raise SystemExit('expected exactly two docker/login-action 4.4.0 references')
          if ci.count('--edition=2021') != 2:
              raise SystemExit('expected exactly two Rust 2021 bench-tool flags in ci.yml')
          ci = ci.replace(old_login, new_login).replace('--edition=2021', '--edition=2024')
          (generated / 'ci.yml').write_text(ci)

          bench = Path('.github/workflows/bench-tools-build.yml').read_text()
          if bench.count('--edition=2021') != 1:
              raise SystemExit('expected exactly one Rust 2021 flag in bench-tools-build.yml')
          (generated / 'bench-tools-build.yml').write_text(
              bench.replace('--edition=2021', '--edition=2024')
          )
          PY
          cargo fmt --all
      - name: Verify explicit lifetimes and staged workflows
        run: |
          set -euxo pipefail
          cargo fmt --all --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          grep -q -- '--edition=2024' generated-workflows/ci.yml
          grep -q -- '--edition=2024' generated-workflows/bench-tools-build.yml
          grep -q 'docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1' generated-workflows/ci.yml
      - name: Commit finalized source and staged workflows
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/limits.rs src/preflight.rs tests/upstream_http2.rs generated-workflows
          git diff --cached --check
          git commit -m 'refactor: make Rust 2024 temporary lifetimes explicit'
          git push origin HEAD:agent/full-stack-refresh
