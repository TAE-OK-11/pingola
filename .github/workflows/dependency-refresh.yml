name: export-full-stack-refresh

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/full-stack-refresh
          fetch-depth: 0
      - name: Install migration tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Reproduce verified refresh
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dockerfile = Path('Dockerfile')
          text = dockerfile.read_text()
          replacements = {
              'ARG DEBIAN_SUITE=trixie': 'ARG DEBIAN_SUITE=13',
              'FROM rust:1.97.1-slim-trixie@sha256:5c6f46a6e4472ab1ca7ba7d494e6677f2f219ebc02f32025d3986f057635ec9c AS builder':
                  'FROM rust:1.97.1-slim-trixie@sha256:69153971349358535be9821190190f026a761f690c6b58c68a914d14ab2d610a AS builder',
              'FROM debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd AS runtime':
                  'FROM debian:13-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd AS runtime',
              '--edition=2021': '--edition=2024',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected Dockerfile text not found: {old}')
              text = text.replace(old, new)
          dockerfile.write_text(text)

          for name in ['.github/workflows/ci.yml', '.github/workflows/bench-tools-build.yml']:
              path = Path(name)
              text = path.read_text()
              if '--edition=2021' not in text:
                  raise SystemExit(f'expected Rust 2021 flag not found in {name}')
              path.write_text(text.replace('--edition=2021', '--edition=2024'))

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          old = 'docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4'
          new = 'docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1'
          if text.count(old) != 2:
              raise SystemExit('expected two pinned login-action references')
          ci.write_text(text.replace(old, new))
          PY

          sed -i 's/edition = "2024"/edition = "2021"/' Cargo.toml
          cargo update --verbose
          cargo fix --edition --all-targets --allow-dirty
          sed -i 's/edition = "2021"/edition = "2024"/' Cargo.toml
          cargo fmt --all
          cargo clippy --fix --all-targets --locked --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
      - name: Package verified refresh
        run: |
          set -euxo pipefail
          rm -f .github/workflows/apply-full-refresh.yml .github/workflows/dependency-refresh.yml
          mkdir -p refresh-output/files
          git diff --name-status > refresh-output/name-status.txt
          git diff --binary > refresh-output/full-refresh.patch
          git diff --name-only -z | while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              mkdir -p "refresh-output/files/$(dirname "$file")"
              cp "$file" "refresh-output/files/$file"
            fi
          done
      - name: Upload verified refresh
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-stack-refresh-output
          path: refresh-output/
          if-no-files-found: error
          retention-days: 3
