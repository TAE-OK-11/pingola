name: apply-modern-compression

on:
  pull_request:
    branches: [agent/quiche-http3]

permissions:
  contents: write

concurrency:
  group: modern-compression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate-and-verify:
    if: github.event.pull_request.head.ref == 'agent/default-modern-compression' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/default-modern-compression
          fetch-depth: 0

      - name: Install build and integration tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake jq libclang-dev nghttp2-client ninja-build openssl perl pkg-config
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Apply compression policy
        run: |
          python3 scripts/apply_modern_compression.py
          cargo fmt --all
          bash -n tests/integration.sh
          python3 -m py_compile tests/backend.py
          git diff --check
          git diff --exit-code -- Cargo.lock

      - name: Verify policy contracts
        run: |
          grep -F 'RouteClass::AdguardUi' src/gateway.rs >/dev/null
          grep -F 'ContentCoding::Zstd' src/content_encoding.rs >/dev/null
          grep -F 'ContentCoding::Brotli' src/content_encoding.rs >/dev/null
          grep -F 'ContentCoding::Gzip' src/content_encoding.rs >/dev/null
          grep -F 'content-encoding: zstd' tests/integration.sh >/dev/null
          grep -F 'content-encoding: br' tests/integration.sh >/dev/null
          grep -F 'content-encoding: gzip' tests/integration.sh >/dev/null
          grep -F 'Navidrome response was unexpectedly compressed by the gateway' tests/integration.sh >/dev/null

      - name: Verify Rust and protocol behavior
        run: |
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo check --all-targets --locked --no-default-features --features system-allocator,tls-boringssl
          cargo check --all-targets --locked --no-default-features --features jemalloc,tls-boringssl
          tests/service_matrix.sh
          tests/integration.sh
          tests/http3.sh

      - name: Commit verified changes
        run: |
          set -euxo pipefail
          git checkout HEAD -- .github/workflows/apply-modern-compression.yml
          git rm scripts/apply_modern_compression.py
          find tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'perf(compression): prefer zstd and brotli outside Navidrome'
          git push origin HEAD:agent/default-modern-compression
