name: format-pingora-upgrade

on:
  push:
    branches:
      - cursor/pingora-0.9-boring-5-f186

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cursor/pingora-0.9-boring-5-f186
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: cargo +1.98.1 fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gateway.rs
          git commit -m "style: format Pingora 0.9 upgrade"
          git push origin HEAD:cursor/pingora-0.9-boring-5-f186
