name: fix-h2load-authority-once

on:
  push:
    branches:
      - cursor/pingora-0.9-boring-5-f186

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cursor/pingora-0.9-boring-5-f186
      - name: Fix h2load authority input
        run: |
          sed -i "/h2load -n/,+3 s/-H 'host: matrix.test'/-H ':authority: matrix.test'/" tests/http2_matrix.sh
          grep -A3 'h2load -n' tests/http2_matrix.sh | grep -F -- "-H ':authority: matrix.test'"
          git diff --check
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-h2load-authority-once.yml
          git add tests/http2_matrix.sh
          git commit -m "test: send canonical H2 authority in h2load matrix"
          git push origin HEAD:cursor/pingora-0.9-boring-5-f186
