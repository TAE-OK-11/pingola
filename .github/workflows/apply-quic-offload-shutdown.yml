name: apply-quic-offload-shutdown

on:
  pull_request:
    branches: [agent/quiche-http3]

permissions:
  contents: write

concurrency:
  group: quic-offload-shutdown-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate-and-verify:
    if: github.event.pull_request.head.ref == 'agent/quic-offload-fast-shutdown' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/quic-offload-fast-shutdown
          fetch-depth: 0

      - name: Install build and integration tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake jq libclang-dev nghttp2-client ninja-build openssl perl pkg-config
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Apply QUIC socket offload and fast shutdown
        run: |
          python3 scripts/apply_quic_offload_shutdown.py
          cargo update -p tokio-quiche --precise 0.19.1
          cargo fmt --all
          git diff --check

      - name: Verify configuration contracts
        run: |
          grep -F 'tokio-quiche = { version = "=0.19.1", default-features = false }' Cargo.toml
          grep -F 'graceful_shutdown_timeout_seconds: 5' config/pingora.yaml
          grep -F 'stop_signal: SIGTERM' docker-compose.yml
          grep -F 'stop_grace_period: 8s' docker-compose.yml
          grep -F 'STOPSIGNAL SIGTERM' Dockerfile
          grep -F 'apply_max_capabilities();' src/http3.rs
          grep -F 'listen_with_capabilities' src/http3.rs
          cargo tree -p tokio-quiche --depth 0 | grep -F 'tokio-quiche v0.19.1'
          cargo tree -p quiche --depth 0 | grep -F 'quiche v0.29.3'
          docker compose config --quiet

      - name: Verify Rust and protocol behavior
        run: |
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo check --all-targets --locked --no-default-features --features system-allocator,tls-boringssl
          cargo check --all-targets --locked --no-default-features --features jemalloc,tls-boringssl
          tests/http3.sh

      - name: Commit verified changes
        run: |
          set -euxo pipefail
          git checkout HEAD -- .github/workflows/apply-quic-offload-shutdown.yml
          git rm scripts/apply_quic_offload_shutdown.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'perf(quic): enable UDP offloads and shorten container drain'
          git push origin HEAD:agent/quic-offload-fast-shutdown
