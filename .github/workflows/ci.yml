name: migrate-shared-h2c-gateway

concurrency:
  group: pingora-h2c-migration-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/quiche-http3
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake jq libcap2-bin nghttp2-client ninja-build openssl perl
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - name: Isolate h2c listener and share gateway state
        id: migrate
        run: |
          set -euo pipefail
          if grep -q 'pingora-http3-h2c-handoff' src/main.rs && \
             grep -q 'static_files: Arc<StaticFiles>' src/gateway.rs; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          gateway = Path('src/gateway.rs')
          text = gateway.read_text()
          old = '''pub struct Gateway {
    runtime: Arc<RuntimeConfig>,
    static_files: StaticFiles,
    hosts: AHashMap<Arc<str>, PreparedHost>,
    plans: Box<[PreparedPlan]>,
    rates: RateLimiter,
    active_requests: ActiveRequestLimiter,
}
'''
          new = '''#[derive(Clone)]
pub struct Gateway {
    runtime: Arc<RuntimeConfig>,
    static_files: Arc<StaticFiles>,
    hosts: Arc<AHashMap<Arc<str>, PreparedHost>>,
    plans: Arc<[PreparedPlan]>,
    rates: Arc<RateLimiter>,
    active_requests: Arc<ActiveRequestLimiter>,
}
'''
          if text.count(old) != 1:
              raise SystemExit('Gateway struct pattern not found')
          text = text.replace(old, new)
          text = text.replace(
              'let static_files = StaticFiles::new(roots, runtime.config.server.static_cache_bytes)?;',
              'let static_files = Arc::new(StaticFiles::new(roots, runtime.config.server.static_cache_bytes)?);',
              1,
          )
          old = '''            static_files,
            hosts,
            plans: prepared_plans.into_boxed_slice(),
            rates: RateLimiter::new(),
            active_requests: ActiveRequestLimiter::new(),
'''
          new = '''            static_files,
            hosts: Arc::new(hosts),
            plans: Arc::from(prepared_plans),
            rates: Arc::new(RateLimiter::new()),
            active_requests: Arc::new(ActiveRequestLimiter::new()),
'''
          if text.count(old) != 1:
              raise SystemExit('Gateway constructor pattern not found')
          gateway.write_text(text.replace(old, new))

          main = Path('src/main.rs')
          text = main.read_text()
          text = text.replace(
              '''    // Accept cleartext HTTP/2 prior knowledge. The dedicated loopback listener
    // uses this path for the H3 -> Pingora bridge, while Pingora 0.8.1 retains
    // HTTP/1.1 detection for ordinary public plaintext listeners.
    http_options.h2c = true;
''',
              '',
              1,
          )
          text = text.replace(
              'ProxyServiceBuilder::new(&server.configuration, gateway)\n',
              'ProxyServiceBuilder::new(&server.configuration, gateway.clone())\n',
              1,
          )
          old = '''    let http3_internal = server_config.http3_internal_listen.to_string();
    if !server_config.http3_listen.is_empty() {
        service.add_tcp_with_settings(&http3_internal, listener_options(&http3_internal)?);
    }
'''
          if text.count(old) != 1:
              raise SystemExit('public internal-listener block not found')
          text = text.replace(old, '', 1)
          marker = '''    service.add_uds(
        &server_config.health_socket.to_string_lossy(),
        Some(Permissions::from_mode(0o600)),
    );

    http3::start(runtime.clone()).context("HTTP/3 frontend startup failed")?;
'''
          replacement = '''    service.add_uds(
        &server_config.health_socket.to_string_lossy(),
        Some(Permissions::from_mode(0o600)),
    );

    if !server_config.http3_listen.is_empty() {
        let mut h2c_options = HttpServerOptions::default();
        h2c_options.h2c = true;
        h2c_options.request_header_timeout = Some(Duration::from_secs(
            server_config.downstream_request_header_timeout_seconds,
        ));
        let mut h2c_service = ProxyServiceBuilder::new(&server.configuration, gateway)
            .name("pingora-http3-h2c-handoff")
            .server_options(h2c_options)
            .build();
        h2c_service.set_connection_limit(server_config.downstream_max_connections);
        let mut h2c_stream_options = default_h2_options();
        h2c_stream_options.max_concurrent_streams(server_config.http3_max_concurrent_streams);
        h2c_stream_options.max_header_list_size(64 * 1024);
        if let Some(proxy) = h2c_service.app_logic_mut() {
            proxy.h2_options = Some(h2c_stream_options);
        }
        let internal = server_config.http3_internal_listen.to_string();
        h2c_service.add_tcp_with_settings(&internal, listener_options(&internal)?);
        server.add_service(h2c_service);
    }

    http3::start(runtime.clone()).context("HTTP/3 frontend startup failed")?;
'''
          if text.count(marker) != 1:
              raise SystemExit('internal service insertion point not found')
          main.write_text(text.replace(marker, replacement))
          PY
          cargo fmt --all
          echo 'changed=true' >> "${GITHUB_OUTPUT}"
      - name: Verify isolated bridge
        if: steps.migrate.outputs.changed == 'true'
        run: |
          set -euxo pipefail
          cargo fmt --all --check
          cargo test --locked --test downstream_admission
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo build --locked
          sudo setcap cap_net_bind_service=+ep target/debug/pingora
          tests/http3.sh
      - name: Commit verified migration
        if: steps.migrate.outputs.changed == 'true'
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/gateway.rs src/main.rs
          git diff --cached --check
          git commit -m 'perf(http3): isolate shared Pingora h2c handoff'
          git push origin HEAD:agent/quiche-http3
