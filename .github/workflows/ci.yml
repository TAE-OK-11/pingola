name: verify-and-publish

concurrency:
  group: pingora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish production images
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths-ignore:
      - h2o/**
      - .github/workflows/h2o.yml
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - h2o/**
      - .github/workflows/h2o.yml

permissions:
  contents: read

env:
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_NET_RETRY: "10"
  RUST_VERSION: "1.98.0"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: RustSec dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build and test tools
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes --no-install-recommends clang cmake jq libcap2-bin llvm nghttp2-client ninja-build openssl perl
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustup show active-toolchain

      - name: Restore Cargo build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-verify-${{ runner.os }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'vendor/**/Cargo.toml') }}
          restore-keys: |
            cargo-verify-${{ runner.os }}-rust-${{ env.RUST_VERSION }}-

      - name: Static and dependency checks
        run: |
          bash -n bench/build_pgo.sh
          bash -n bench/pgo_train.sh
          bash -n bench/pgo_train_h3.sh
          bash -n bench/pgo_train_upstream_h3.sh
          rustc --edition=2024 -D warnings bench/backend.rs -o /tmp/pgo-backend
          rustc --edition=2024 -D warnings bench/pgo_client.rs -o /tmp/pgo-client
          cargo fmt --all --check

          cargo tree --locked > /tmp/cargo-tree.txt
          cargo tree --locked -p pingora-boringssl@0.8.1 > /tmp/pingora-tls-tree.txt
          cargo tree --locked -p tokio-quiche@0.19.1 > /tmp/http3-tls-tree.txt
          cargo tree --locked -i boring@4.22.0 > /tmp/boring-reverse-tree.txt
          grep -q 'pingora-boringssl v0.8.1' /tmp/cargo-tree.txt
          grep -q 'quiche v0.29.3' /tmp/http3-tls-tree.txt
          grep -q 'boring v4.22.0' /tmp/pingora-tls-tree.txt
          grep -q 'boring-sys v4.22.0' /tmp/pingora-tls-tree.txt
          grep -q 'boring v4.22.0' /tmp/http3-tls-tree.txt
          grep -q 'boring-sys v4.22.0' /tmp/http3-tls-tree.txt
          grep -q 'pingora-boringssl v0.8.1' /tmp/boring-reverse-tree.txt
          grep -Eq '(quiche v0.29.3|tokio-quiche v0.19.1)' /tmp/boring-reverse-tree.txt
          ! grep -Eiq '(^|[[:space:]])(aws-lc-rs|aws-lc-sys|rustls) v' /tmp/cargo-tree.txt
          ! cargo tree --locked -d | grep -E '^(boring|boring-sys) v'

      - name: Rust tests and lints
        run: |
          cargo test --all-targets --locked
          cargo build --locked
          sudo setcap cap_net_bind_service=+ep target/debug/pingora
          cargo clippy --all-targets --locked -- -D warnings

      - name: Allocator fallback builds
        run: |
          cargo check --all-targets --locked --no-default-features --features system-allocator,tls-boringssl
          cargo check --all-targets --locked --no-default-features --features jemalloc,tls-boringssl

      - name: Protocol, security, and HTTP/3 integration
        run: |
          sudo tests/runtime_preflight.sh
          tests/listeners_health.sh
          tests/retries.sh
          tests/limit_isolation.sh
          tests/static_global_limit.sh
          tests/service_matrix.sh
          tests/integration.sh
          tests/http2_matrix.sh
          tests/http3.sh
          bash tests/upstream_http3.sh

  image-test:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish_images != true)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_cpu: x86-64-v2
            pgo_mode: train
            native_pgo: on
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image once
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: pingora:ci-${{ matrix.target_cpu }}
          pull: true
          build-args: |
            ALLOCATOR=tcmalloc
            TLS_PROVIDER=boringssl
            PGO_MODE=${{ matrix.pgo_mode }}
            PGO_NATIVE_BORING=${{ matrix.native_pgo }}
            PGO_TRAIN_TARGET_CPU=${{ matrix.target_cpu }}
            PGO_WEIGHT_H1=60
            PGO_WEIGHT_H2=180
            PGO_WEIGHT_H3=900
            PGO_WEIGHT_UPSTREAM_H3_BBR2=700
            PGO_WEIGHT_UPSTREAM_H3_CUBIC=250
            PGO_WEIGHT_TLS=300
            PGO_WEIGHT_TAIL=80
            RUST_TARGET_CPU=${{ matrix.target_cpu }}
            RUST_LTO=fat
            BUILD_VERSION=ci
            BUILD_REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=image-test-${{ matrix.target_cpu }}-${{ matrix.pgo_mode }}
            type=gha,scope=image-${{ matrix.target_cpu }}-full-pgo
          cache-to: type=gha,mode=max,scope=image-test-${{ matrix.target_cpu }}-${{ matrix.pgo_mode }}

      - name: Verify image
        env:
          IMAGE: pingora:ci-${{ matrix.target_cpu }}
          PINGORA_TEST_IMAGE: pingora:ci-${{ matrix.target_cpu }}
          PINGORA_EXPECTED_TARGET_CPU: ${{ matrix.target_cpu }}
          PINGORA_EXPECTED_LTO: fat
          PINGORA_EXPECTED_TLS_PROVIDER: boringssl
          PINGORA_EXPECTED_PGO: ${{ matrix.pgo_mode }}
        run: |
          test "$(docker image inspect "${IMAGE}" | jq -r '.[0].Config.Labels["org.opencontainers.image.rust.pgo-train-target-cpu"]')" = "${{ matrix.target_cpu }}"
          test "$(docker image inspect "${IMAGE}" | jq -r '.[0].Config.Labels["org.opencontainers.image.native.pgo"]')" = "${{ matrix.native_pgo }}"
          tests/docker_runtime.sh
          docker run --rm --entrypoint test "${IMAGE}" -s /usr/share/doc/pingora/pgo-profile-summary.txt
          docker run --rm --entrypoint test "${IMAGE}" -s /usr/share/doc/pingora/pgo-native-profile-summary.txt

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_images)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/tae-ok-11/pingora
            ghcr.io/tae-ok-11/pingola
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=JBS Pingora
            org.opencontainers.image.description=Cloudflare BoringSSL TLS, Quiche HTTP/3, and h2c internal bridge
            org.opencontainers.image.source=https://github.com/TAE-OK-11/pingola
            org.opencontainers.image.allocator=tcmalloc
            org.opencontainers.image.tls.provider=boringssl
            org.opencontainers.image.http3.provider=quiche
            org.opencontainers.image.http3.internal-protocol=h2c

      - name: Build and publish x86-64-v2 full-stack PGO
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALLOCATOR=tcmalloc
            TLS_PROVIDER=boringssl
            PGO_MODE=train
            PGO_NATIVE_BORING=on
            PGO_TRAIN_TARGET_CPU=x86-64-v2
            PGO_WEIGHT_H1=60
            PGO_WEIGHT_H2=180
            PGO_WEIGHT_H3=900
            PGO_WEIGHT_UPSTREAM_H3_BBR2=700
            PGO_WEIGHT_UPSTREAM_H3_CUBIC=250
            PGO_WEIGHT_TLS=300
            PGO_WEIGHT_TAIL=80
            RUST_TARGET_CPU=x86-64-v2
            RUST_LTO=fat
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=image-x86-64-v2-full-pgo
            type=gha,scope=image-test-x86-64-v2-train
          cache-to: type=gha,mode=max,scope=image-x86-64-v2-full-pgo
          provenance: mode=max
          sbom: true
