name: verify-and-publish

concurrency:
  group: pingora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply upstream transport performance patch
        run: |
          python3 .github/perf_patch.py
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          cargo +1.97.1 fmt --all
          git diff --check

          git rm .github/workflows/perf-bootstrap.yml .github/perf_patch.py
          git checkout HEAD^^^ -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: raise upstream H2 and H3 transport capacity"
          git push origin HEAD:${{ github.head_ref }}