name: port-pingora-h2-timeout

on:
  push:
    branches:
      - cursor/pingora-0.9-boring-5-f186

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cursor/pingora-0.9-boring-5-f186
      - name: Apply source patch
        run: python3 scripts/port_pingora09_h2_timeout.py
      - name: Install rustfmt
        run: rustup component add --toolchain 1.98.1-x86_64-unknown-linux-gnu rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/port-pingora-h2-timeout.yml scripts/port_pingora09_h2_timeout.py
          git add vendor/pingora-core-0.9.0/src/protocols/http/v2/server.rs tests/h2_downstream_timeout.rs
          git commit -m "fix: port H2 downstream read timeout to Pingora 0.9"
          git push origin HEAD:cursor/pingora-0.9-boring-5-f186
