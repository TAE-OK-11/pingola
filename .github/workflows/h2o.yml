name: h2o-verify-and-publish

concurrency:
  group: h2o-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish H2O production images
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - h2o/**
      - .github/workflows/h2o.yml
    tags: ["h2o-v*"]
  pull_request:
    paths:
      - h2o/**
      - .github/workflows/h2o.yml

permissions:
  contents: read

jobs:
  verify-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      h2o_version: ${{ steps.pins.outputs.H2O_VERSION }}
      boringssl_version: ${{ steps.pins.outputs.BORINGSSL_VERSION }}
      jemalloc_version: ${{ steps.pins.outputs.JEMALLOC_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load and check dependency pins
        id: pins
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source h2o/deps.env
          set +a
          grep -F "ARG H2O_VERSION=${H2O_VERSION}" h2o/Dockerfile
          grep -F "ARG BORINGSSL_VERSION=${BORINGSSL_VERSION}" h2o/Dockerfile
          grep -F "ARG JEMALLOC_VERSION=${JEMALLOC_VERSION}" h2o/Dockerfile
          grep -F "ARG DEBIAN_DIGEST=${DEBIAN_DIGEST}" h2o/Dockerfile
          test "$(grep -c "${DEBIAN_DIGEST#sha256:}" h2o/Dockerfile)" -ge 3
          grep -F "# syntax=${DOCKERFILE_SYNTAX}" h2o/Dockerfile
          bash -n h2o/scripts/healthcheck.sh
          bash -n h2o/scripts/build-tls.sh
          bash -n h2o/scripts/build-jemalloc.sh
          bash -n h2o/scripts/allocator-info.sh
          bash -n h2o/tests/docker_runtime.sh
          grep -q 'num-threads: 1' h2o/config/h2o.conf
          grep -q 'temp-buffer-path: /tmp/h2o' h2o/config/h2o.conf
          grep -q 'max-connections: 2048' h2o/config/h2o.conf
          grep -q 'http2-idle-timeout: 300' h2o/config/h2o.conf
          grep -q 'http3-idle-timeout: 300' h2o/config/h2o.conf
          grep -q 'proxy.preserve-host: ON' h2o/config/h2o.conf
          grep -q 'proxy.tunnel: ON' h2o/config/h2o.conf
          grep -q 'type: quic' h2o/config/h2o.conf
          grep -F 'MALLOC_CONF="narenas:1,retain:false,dirty_decay_ms:1000,tcache_max:8192"' h2o/Dockerfile
          grep -q 'ghcr.io/tae-ok-11/h2o' h2o/docker-compose.yml
          {
            echo "H2O_VERSION=${H2O_VERSION}"
            echo "BORINGSSL_VERSION=${BORINGSSL_VERSION}"
            echo "JEMALLOC_VERSION=${JEMALLOC_VERSION}"
          } >>"${GITHUB_OUTPUT}"

  image-test:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish_images != true)
    needs: verify-config
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Load dependency pins
        run: |
          set -a
          # shellcheck disable=SC1091
          source h2o/deps.env
          set +a
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' h2o/deps.env >>"${GITHUB_ENV}"

      - name: Build H2O image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: h2o
          load: true
          tags: h2o:ci
          pull: true
          build-args: |
            H2O_VERSION=${{ needs.verify-config.outputs.h2o_version }}
            BORINGSSL_VERSION=${{ needs.verify-config.outputs.boringssl_version }}
            JEMALLOC_VERSION=${{ needs.verify-config.outputs.jemalloc_version }}
            TARGET_CPU=x86-64-v2
            LTO_MODE=fat
            BUILD_VERSION=ci
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=h2o-standalone-${{ hashFiles('h2o/deps.env') }}
          cache-to: type=gha,mode=max,scope=h2o-standalone-${{ hashFiles('h2o/deps.env') }}

      - name: Verify H2O image
        env:
          IMAGE: h2o:ci
          H2O_TEST_IMAGE: h2o:ci
        run: |
          test "$(docker image inspect "${IMAGE}" | jq -r '.[0].Config.Labels["org.opencontainers.image.h2o.target-cpu"]')" = "x86-64-v2"
          test "$(docker image inspect "${IMAGE}" | jq -r '.[0].Config.Labels["org.opencontainers.image.h2o.lto"]')" = "fat"
          test "$(docker image inspect "${IMAGE}" | jq -r '.[0].Config.Labels["org.opencontainers.image.tls.provider"]')" = "boringssl"
          test "$(docker image inspect "${IMAGE}" | jq -r '.[0].Config.Labels["org.opencontainers.image.allocator"]')" = "jemalloc"
          test "$(docker image inspect "${IMAGE}" | jq -r '.[0].Config.Labels["org.opencontainers.image.allocator.jemalloc"]')" = "${{ needs.verify-config.outputs.jemalloc_version }}"
          test "$(docker image inspect "${IMAGE}" | jq -r '.[0].Config.Labels["org.opencontainers.image.tls.boringssl"]')" = "${{ needs.verify-config.outputs.boringssl_version }}"
          test "$(docker image inspect "${IMAGE}" | jq -r '.[0].Config.Env[]' | sed -n 's/^MALLOC_CONF=//p')" \
            = "narenas:1,retain:false,dirty_decay_ms:1000,tcache_max:8192"
          bash h2o/tests/docker_runtime.sh

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_images)
    needs: verify-config
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Load dependency pins
        run: |
          set -a
          # shellcheck disable=SC1091
          source h2o/deps.env
          set +a
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' h2o/deps.env >>"${GITHUB_ENV}"

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/tae-ok-11/h2o
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=jemalloc,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=match,pattern=h2o-v(.*),group=1
          labels: |
            org.opencontainers.image.title=JBS H2O
            org.opencontainers.image.description=Debian 13 H2O with BoringSSL, jemalloc, and kTLS
            org.opencontainers.image.source=https://github.com/TAE-OK-11/pingola
            org.opencontainers.image.h2o.version=${{ needs.verify-config.outputs.h2o_version }}
            org.opencontainers.image.tls.provider=boringssl
            org.opencontainers.image.tls.boringssl=${{ needs.verify-config.outputs.boringssl_version }}
            org.opencontainers.image.allocator=jemalloc
            org.opencontainers.image.allocator.jemalloc=${{ needs.verify-config.outputs.jemalloc_version }}

      - name: Build and publish H2O image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: h2o
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            H2O_VERSION=${{ needs.verify-config.outputs.h2o_version }}
            BORINGSSL_VERSION=${{ needs.verify-config.outputs.boringssl_version }}
            JEMALLOC_VERSION=${{ needs.verify-config.outputs.jemalloc_version }}
            TARGET_CPU=x86-64-v2
            LTO_MODE=fat
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=h2o-standalone-${{ hashFiles('h2o/deps.env') }}
          cache-to: type=gha,mode=max,scope=h2o-standalone-${{ hashFiles('h2o/deps.env') }}
          provenance: mode=max
          sbom: true
