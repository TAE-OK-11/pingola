# JBS gateway configuration for H2O.
# Mirrors config/pingora.yaml upstreams and host routing for drop-in replacement.

num-threads: 1
temp-buffer-path: /tmp/h2o
proxy.emit-x-forwarded-headers: ON
proxy.timeout.connect: 2000
proxy.timeout.io: 30000
proxy.timeout.keepalive: 15000

listen:
  - host: 0.0.0.0
    port: 80
  - host: "[::]"
    port: 80
  - host: 0.0.0.0
    port: 443
    ssl: &tls
      certificate-file: /etc/h2o/cert/live/tae00217.cloud/fullchain.pem
      key-file: /etc/h2o/cert/live/tae00217.cloud/privkey.pem
      minimum-version: TLSv1.2
      cipher-preference: server
  - host: "[::]"
    port: 443
    ssl: *tls
  - type: quic
    host: 0.0.0.0
    port: 443
    ssl: *tls
  - type: quic
    host: "[::]"
    port: 443
    ssl: *tls

hosts:
  "health.invalid":
    paths:
      /h2o-health:
        file.dir: /usr/share/h2o/health
      /pingora-health:
        file.dir: /usr/share/h2o/health

  "cdn.music.tae00217.cloud":
    paths:
      /:
        proxy.reverse.url: http://10.77.0.1:4533

  "music.tae00217.cloud":
    paths:
      /:
        proxy.reverse.url: http://10.77.0.1:4533

  "password.tae00217.cloud":
    paths:
      /:
        proxy.reverse.url: http://10.77.0.1:8081
        limit-request-body: 536870912

  "sync.tae00217.cloud":
    paths:
      /:
        proxy.reverse.url: http://10.77.0.1:5984
        limit-request-body: 536870912

  "dns.tae00217.cloud":
    paths:
      /:
        proxy.reverse.url: http://10.77.0.1:3333
        limit-request-body: 65536

  "korea.tae00217.cloud":
    paths:
      /:
        proxy.reverse.url: http://127.0.0.1:3333
        limit-request-body: 65536

  "cdn.music.tae00217.cloud:80":
    paths:
      /:
        redirect: https://cdn.music.tae00217.cloud$request_uri

  "music.tae00217.cloud:80":
    paths:
      /:
        redirect: https://music.tae00217.cloud$request_uri

  "password.tae00217.cloud:80":
    paths:
      /:
        redirect: https://password.tae00217.cloud$request_uri

  "sync.tae00217.cloud:80":
    paths:
      /:
        redirect: https://sync.tae00217.cloud$request_uri

  "dns.tae00217.cloud:80":
    paths:
      /:
        redirect: https://dns.tae00217.cloud$request_uri

  "korea.tae00217.cloud:80":
    paths:
      /:
        redirect: https://korea.tae00217.cloud$request_uri
